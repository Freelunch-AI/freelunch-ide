# Development environment for the FreeLunch repository.
#
# `pixi install` provisions every tool below at a pinned version, so a fresh
# machine needs only Pixi itself (and Docker, for tests that use containers).
# Build logic lives in Taskfile.yml; the tasks here are thin entry points.
[workspace]
name = "freelunch-ide"
version = "0.0.0"
description = "FreeLunch IDE and CLI — platform engine, workbench frontend, and docs"
authors = ["FreeLunch <https://github.com/Freelunch-AI>"]
channels = ["conda-forge"]
# osx-64 was dropped: nobody on the team uses an Intel Mac, and it held the
# floor for several conda-forge packages far below what the rest of the
# platforms can resolve. Apple Silicon is covered by osx-arm64.
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
# Core engine and CLI. Must satisfy the directive in go.mod.
go = ">=1.25.6,<2"

# Build orchestration.
go-task = ">=3.52,<4"

# Go lint and format. The v2 config schema is used in .golangci.yml.
golangci-lint = ">=2.12,<3"

# Release archives for the CLI.
goreleaser = ">=2.11,<3"

# IDE frontend toolchain. npm ships with nodejs; package versions are pinned by
# package-lock.json, not here.
nodejs = ">=24,<27"

# Kubernetes tooling for the local Demo environment (roadmap 1.2).
# Mind the conda-forge name: Helm ships as `kubernetes-helm`, and pinning the
# bare name `helm` fails to resolve. 4.2.4 is available on all four platforms
# this workspace declares.
kubernetes-helm = ">=4.2,<5"

# kubectl and k3d are deliberately NOT here; scripts/install-*.sh fetch them at
# pinned versions into ~/.freelunch/bin. Three reasons, in order of weight:
#
#   1. A customer running `freelunch install` has Docker and nothing else — no
#      pixi. The CLI must be able to provision these tools itself, so pixi
#      could only ever solve this for us and not for them. One mechanism for
#      both is what keeps the shipped path and the tested path identical.
#   2. kubectl ships as `kubernetes-client`, whose newest build common to all
#      four declared platforms is 1.23.6 — osx-64 and linux-aarch64 lag far
#      behind. That is several years older than the k3s server we run and well
#      outside the supported version skew.
#   3. The conda-forge package named `k3d` is K3D Jupyter, an unrelated 3D
#      plotting library. It resolves and installs cleanly, so adding it here
#      would fail silently rather than loudly.

# conda-forge's Go on Linux invokes the conda cross-compiler
# (x86_64-conda-linux-gnu-cc) for cgo, and `go test -race` requires cgo.
# The compiler ships in a separate package, so without this every Go test
# run on a Linux machine fails with "C compiler ... not found". macOS is
# not affected: the osx Go builds use the system clang.
[target.linux-64.dependencies]
c-compiler = ">=1.8,<2"

[target.linux-aarch64.dependencies]
c-compiler = ">=1.8,<2"

[activation.env]
# Pixi is the single source of truth for the Go version. GOTOOLCHAIN defaults to
# "auto", under which the go command may silently download a toolchain other than
# the one pinned above whenever a go.mod asks for something newer. "local" forces
# it to use exactly the Go that Pixi provisioned, so the pin here is the only
# version that can ever run.
GOTOOLCHAIN = "local"

[tasks]
setup = { cmd = "task setup", description = "Install Go and Node dependencies" }
fmt = { cmd = "task fmt", description = "Format all sources" }
lint = { cmd = "task lint", description = "Lint all sources" }
test = { cmd = "task test", description = "Run all tests" }
build = { cmd = "task build", description = "Build the CLI and TypeScript workspace" }
package = { cmd = "task package", description = "Build release archives locally" }
check = { cmd = "task check", description = "Run the full check suite before pushing" }
