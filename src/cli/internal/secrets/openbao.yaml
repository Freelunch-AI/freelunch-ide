# Local secrets store for roadmap 1.4 — OpenBao in dev mode.
#
# OpenBao rather than HashiCorp Vault (decision D1): Vault is BUSL-1.1 since
# August 2023, restricting embedded commercial use; OpenBao is the Linux
# Foundation fork of the last MPL-2.0 codebase with the same API surface.
#
# NOT SECURE, deliberately: dev mode is in-memory, auto-unsealed, with a known
# root token. It holds nothing real and loses everything on restart, which is
# why seeding is part of install and re-runnable, never a one-time step.
#
# No Ingress on purpose: the consumer is external-secrets-operator (2.1),
# which runs in-cluster and reaches the Service by DNS. Debugging from the
# host goes through `kubectl exec` or `kubectl port-forward`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: freelunch-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: freelunch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        app.kubernetes.io/part-of: freelunch
    spec:
      containers:
        - name: openbao
          image: ghcr.io/openbao/openbao:2.6.2
          # Flags rather than env vars: OpenBao renamed the environment
          # variables (BAO_*, not VAULT_*), and explicit args cannot be
          # mis-named. -dev-listen-address is load-bearing — dev mode binds
          # 127.0.0.1 by default, which would make the Service route to a
          # port nothing listens on for out-of-pod callers.
          args:
            - server
            - -dev
            - -dev-root-token-id=freelunch-dev-root
            - -dev-listen-address=0.0.0.0:8200
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              # Standard sys/health: 200 = initialized, unsealed, active.
              path: /v1/sys/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: freelunch-system
spec:
  selector:
    app.kubernetes.io/name: openbao
  ports:
    - name: http
      port: 8200
      targetPort: http
