# The namespace every FreeLunch platform component lives in.
#
# It is shared, so no component owns it: each component that needs it applies
# this file before its own manifests (kubectl apply is idempotent, so order and
# repetition do not matter) and never deletes it — deleting a namespace takes
# everything inside it, sibling components included. It disappears with the
# cluster on uninstall, which is the only teardown that should remove it.
#
# This file exists identically in every component package that needs it; a
# test in each package asserts the copies match. go:embed cannot reach across
# packages, and the packages may not import one another, so a copy per package
# is the honest shape.
apiVersion: v1
kind: Namespace
metadata:
  name: freelunch-system
  labels:
    app.kubernetes.io/part-of: freelunch
