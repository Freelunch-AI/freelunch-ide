[config]
restricted_mode = true

[pr_reviewer]
extra_instructions = """
Review this repository as a senior platform engineer and flag all problems encountered with appropriate metadata.

Always:

- See if the PR is compliant with the Global Spec for the Demo. The global spec is defined via these important files located in this repo: founding_doc.md, which defines the end goal of the Demo and out-of-scope work; roadmap.md, which defines the feature roadmap of the Demo; and tech_stack.md, which defines the tech stack of the Demo. This includes a dependency check: find all direct dependencies used in this PR and see if they are compliant with tech_stack.md.
- Give a score to the PR, from 0 to 10, where 10 means the PR has no problems.
- Suggest topics for a reviewer to study before reviewing the PR (e.g., study the basics of goroutines, study gRPC, etc.) so that they understand the important pieces well. Assume the reviewer is a new programmer with a superficial understanding.

Never:

- Report minor formatting or stylistic issues.
  """
