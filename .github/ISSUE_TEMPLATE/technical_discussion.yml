name: Technical discussion
description: Discuss an open question or technical decision with the team
title: "[Discussion]: "
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Briefly explain the problem, opportunity, or background.
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: What needs to be decided?
      description: State the question or outcome the team should align on.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options or initial ideas
      description: Add any approaches, tradeoffs, constraints, or references already considered.
