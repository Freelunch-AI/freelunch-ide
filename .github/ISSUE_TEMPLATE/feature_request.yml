name: Feature request
description: Propose a new capability or an improvement to an existing workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the user need and desired outcome. Implementation details can be refined after the scope is agreed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same request.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Product area
      description: Choose the area most closely related to the request.
      options:
        - IDE / Theia frontend
        - CLI / Go core engine
        - L1 model / CUE schema / L1-to-L2 compiler
        - Local environment / Kubernetes infrastructure
        - CI/CD / GitOps / deployment
        - Authentication / secrets / permissions
        - Observability / cost
        - Agent API / FreeLunch skill
        - Documentation / sample application
        - Post-Demo module
        - Other / cross-cutting
    validations:
      required: true

  - type: dropdown
    id: roadmap_scope
    attributes:
      label: Roadmap scope
      description: Use the ordered feature specification when the request maps to known work.
      options:
        - Demo scope (Groups 1-10)
        - Low priority (Group 11)
        - Post-Demo module
        - Not in the current roadmap
        - Unsure
    validations:
      required: true

  - type: input
    id: roadmap_reference
    attributes:
      label: Related roadmap item
      description: If applicable, reference the exact feature number or module document.
      placeholder: "Example: 3.2 L1-to-L2 Compilation Engine"

  - type: textarea
    id: need
    attributes:
      label: User need
      description: Explain the problem, who experiences it, and why it matters.
      placeholder: As a ..., I need ..., because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior or workflow you want, without requiring a final technical design.
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: What would make this complete?
      description: Give a few observable examples or acceptance criteria.
      placeholder: |
        - [ ] A developer can ...
        - [ ] The system shows ...
        - [ ] Documentation covers ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
      description: Note current workarounds, rejected options, mockups, related issues, or constraints.
